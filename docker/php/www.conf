; PHP-FPM pool overrides for the LSPU EIS app.
;
; The stock php:8.2-fpm image ships pm.max_children = 5. Any page that
; makes a handful of concurrent AJAX calls (the dashboard) plus a second
; browser tab or a second admin can exhaust that, and further requests —
; including plain page navigations — queue until a worker frees. 5 is a
; single-user assumption; 16 gives real headroom without risking memory
; on the VPS (each worker ~50-80 MB).

[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; recycle workers periodically so a slow leak can't accumulate
pm.max_requests = 500
; surface a slow request in the fpm log without killing it
request_slowlog_timeout = 15s
slowlog = /proc/self/fd/2
