; Production PHP settings for the LSPU EIS app.
memory_limit = 768M
upload_max_filesize = 50M
post_max_size = 50M
; the bulk alumni / employment-report import raises these per-request too
max_execution_time = 600
max_input_time = 300
expose_php = Off
date.timezone = Asia/Manila

; OPcache — validate_timestamps=0 means you MUST restart the app container
; after deploying new code (the deploy steps below do this).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
