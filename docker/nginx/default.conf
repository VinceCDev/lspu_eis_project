server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    # Long cache for the vendored static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # long enough for the bulk alumni / employment-report import
        fastcgi_read_timeout 600;
    }

    # Deny access to hidden files except .well-known (ACME/Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
