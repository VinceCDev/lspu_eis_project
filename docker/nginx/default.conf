server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    # Compress text assets — the vendored CSS/JS (Font Awesome, Tailwind,
    # Vue, Chart.js, Leaflet) are served raw otherwise, ~4x larger on the wire.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/ttf application/vnd.ms-fontobject;

    # Long cache for the vendored static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # long enough for the bulk alumni / employment-report import
        fastcgi_read_timeout 600;
    }

    # Deny access to hidden files except .well-known (ACME/Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
