# Private Apache for load tests: 16 worker threads == prod's php-fpm pm.max_children=16.
ServerRoot "C:/xampp/apache"
Listen 8092
ServerName 127.0.0.1:8092
PidFile "C:/lspu_perf/apache/httpd_after.pid"
ErrorLog "C:/lspu_perf/apache/logs/error_after.log"
LogLevel warn
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPIniDir "C:/lspu_perf/php"
TypesConfig conf/mime.types
AddHandler application/x-httpd-php .php
DirectoryIndex index.php
Timeout 900
KeepAlive On
ListenBackLog 511
<IfModule mpm_winnt_module>
    ThreadsPerChild 16
    MaxConnectionsPerChild 0
</IfModule>
DocumentRoot "C:/lspu_perf/after/public"
<Directory "C:/lspu_perf/after/public">
    AllowOverride All
    Require all granted
</Directory>
