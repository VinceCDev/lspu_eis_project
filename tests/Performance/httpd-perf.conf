# Private Apache for load tests: 16 worker threads == prod's php-fpm pm.max_children=16.
ServerRoot "C:/xampp/apache"
Listen 8091
ServerName 127.0.0.1:8091
PidFile "C:/lspu_perf/apache/httpd.pid"
ErrorLog "C:/lspu_perf/apache/logs/error.log"
LogLevel warn
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPIniDir "C:/lspu_perf/php"
TypesConfig conf/mime.types
AddHandler application/x-httpd-php .php
DirectoryIndex index.php
Timeout 900
KeepAlive On
ListenBackLog 511
<IfModule mpm_winnt_module>
    ThreadsPerChild 16
    MaxConnectionsPerChild 0
</IfModule>
DocumentRoot "C:/xampp/htdocs/lspu_eis_laravel/public"
<Directory "C:/xampp/htdocs/lspu_eis_laravel/public">
    AllowOverride All
    Require all granted
</Directory>

# helper: curl http://127.0.0.1:8091/__opcache_reset after editing code (local requests only)
Alias /__opcache_reset "C:/xampp/htdocs/lspu_eis_laravel/tests/Performance/opcache_reset.php"
<Directory "C:/xampp/htdocs/lspu_eis_laravel/tests/Performance">
    Require local
</Directory>
