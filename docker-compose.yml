# LSPU EIS — production Docker stack for a single VPS.
#
#   app       PHP-FPM (runs migrations + caching on boot via entrypoint)
#   web       Nginx, published on port 80
#   db        MySQL 8
#   queue     php artisan queue:work  (database queue)
#   scheduler php artisan schedule:run every 60s (backups, purge-stale, etc.)
#
# Fully self-contained: code is baked into the images, so no repo checkout
# needs to persist on the host. Config can be overridden via environment
# variables (Hostinger Docker Manager env panel, or a .env file next to
# this compose file); sensible defaults let it boot without any.
#
# The MySQL port is NOT published — the database is only reachable on the
# internal compose network, so the default DB password is acceptable for a
# first boot. Change DB_PASSWORD / DB_ROOT_PASSWORD when you can.

x-laravel-env: &laravel-env
  APP_NAME: "LSPU EIS"
  APP_ENV: "${APP_ENV:-production}"
  APP_KEY: "${APP_KEY:-}"
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: "${APP_URL:-http://72.62.240.65:8080}"
  LOG_CHANNEL: stack
  LOG_LEVEL: "${LOG_LEVEL:-warning}"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: "${DB_DATABASE:-lspu_eis}"
  DB_USERNAME: "${DB_USERNAME:-lspu_eis}"
  DB_PASSWORD: "${DB_PASSWORD:-lspu_eis_db_pass}"
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: "${MAIL_MAILER:-log}"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lspu-eis-app:latest
    restart: unless-stopped
    environment:
      <<: *laravel-env
    volumes:
      - storage-data:/var/www/html/storage
      - uploads-data:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: lspu-eis-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - uploads-data:/var/www/html/public/uploads:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-lspu_eis}"
      MYSQL_USER: "${DB_USERNAME:-lspu_eis}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-lspu_eis_db_pass}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-lspu_eis_root_pass}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-lspu_eis_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 30

  queue:
    image: lspu-eis-app:latest
    restart: unless-stopped
    environment:
      <<: *laravel-env
      APP_BOOTSTRAP: skip
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      - app
      - db

  scheduler:
    image: lspu-eis-app:latest
    restart: unless-stopped
    environment:
      <<: *laravel-env
      APP_BOOTSTRAP: skip
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      - app
      - db

volumes:
  db-data:
  storage-data:
  uploads-data:
