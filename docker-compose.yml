# LSPU EIS — production Docker stack for a single VPS.
#
#   app   PHP-FPM (imports database/schema.sql + caches config on boot)
#   web   Nginx, published on ${WEB_PORT:-8080}
#   db    MySQL 8
#
# This app does NOT use queues (its `jobs` table is job postings, not a
# Laravel queue table) and defines no scheduled tasks, so there is no
# queue worker or scheduler service. QUEUE_CONNECTION is forced to sync.
#
# Config can be overridden via environment variables (Hostinger Docker
# Manager env panel, or a .env file next to this compose file); sensible
# defaults let it boot without any. The MySQL port is NOT published.

x-laravel-env: &laravel-env
  APP_NAME: "LSPU EIS"
  APP_ENV: "${APP_ENV:-production}"
  APP_KEY: "${APP_KEY:-}"
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: "${APP_URL:-http://72.62.240.65:8080}"
  LOG_CHANNEL: stack
  LOG_LEVEL: "${LOG_LEVEL:-warning}"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: "${DB_DATABASE:-lspu_eis}"
  DB_USERNAME: "${DB_USERNAME:-lspu_eis}"
  DB_PASSWORD: "${DB_PASSWORD:-lspu_eis_db_pass}"
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  MAIL_MAILER: "${MAIL_MAILER:-log}"
  SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL:-lspueis@gmail.com}"
  SUPERADMIN_PASSWORD: "${SUPERADMIN_PASSWORD:-ChangeMe!Super2026}"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lspu-eis-app:latest
    restart: unless-stopped
    environment:
      <<: *laravel-env
    volumes:
      - storage-data:/var/www/html/storage
      - uploads-data:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: lspu-eis-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - uploads-data:/var/www/html/public/uploads:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    # native password auth so the (MariaDB) mysql client in the app image
    # can connect without caching_sha2_password; a bigger buffer pool keeps
    # the reporting GROUP BYs in memory on a small VPS.
    command: >-
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=384M
      --innodb-flush-neighbors=0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-lspu_eis}"
      MYSQL_USER: "${DB_USERNAME:-lspu_eis}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-lspu_eis_db_pass}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-lspu_eis_root_pass}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-lspu_eis_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  storage-data:
  uploads-data:
